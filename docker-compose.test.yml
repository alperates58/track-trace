name: track-trace-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: track_trace_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_postgres_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d track_trace_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=track_trace_test;Username=postgres;Password=test_postgres_password
      Jwt__Secret: isolated_test_jwt_secret_minimum_32_chars
      Jwt__ExpiryHours: 1
      Seed__AdminUsername: admin
      Seed__AdminPassword: admin123
      Seed__AdminName: Test Administrator
      MaxUploadMb: 10
    ports:
      - "18081:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 30
